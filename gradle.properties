# HuhuTalk —— Minecraft 1.20.1 / Forge 47.4.16 / Java 17 构建属性
# 本文件只保存可公开的构建参数；中文展示文本放在 build.gradle / mods.toml，
# 避免 java.util.Properties 以 ISO-8859-1 读取时破坏多字节字符。

# ── Gradle 运行环境 ──────────────────────────────────────────────────────────
# ForgeGradle 反编译需要较多堆内存；workers 固定为 2，避免并发反编译打满机器。
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2 -Djdk.tls.client.protocols=TLSv1.2
org.gradle.daemon=false
org.gradle.workers.max=2
# 若 TLS 握手仍失败，完整堆栈便于上游定位底层 SSL cause；不改变证书校验。
org.gradle.logging.stacktrace=all

# ── Minecraft / Forge 版本 ───────────────────────────────────────────────────
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=47.4.16
forge_version_range=[47.4.16,48)
loader_version_range=[47,48)

# 官方 Mojang 映射（ForgeGradle official channel），不使用 Parchment。
mapping_channel=official
mapping_version=1.20.1

# ── 模组元数据 ───────────────────────────────────────────────────────────────
mod_id=huhutalk
mod_name=HUHUTALK
mod_group_id=com.huhutalk
# 开发期版本号，不是正式发布号。
mod_version=1.1.0-forge1.20.1-dev
mod_license=Mixed; see LICENSE and THIRD_PARTY_NOTICES.md
mod_artifact=huhutalk

# ── 网络 ─────────────────────────────────────────────────────────────────────
# 本机代理（保留用户原有环境）。只有 Maven Central 与 localhost 直连；
# Forge / Modrinth / Sponge / Gradle 插件等已验证走代理路由，不可无依据改成直连。
# 注意：JVM 只读取 http.nonProxyHosts（HTTPS 同样复用该列表），
# 旧的 systemProp.https.nonProxyHosts 是无效键，已删除。
# TLS 证书校验保持开启，仅显式启用 TLSv1.2（已验证 Forge 仓库可路由）。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
systemProp.http.nonProxyHosts=localhost|127.*|[::1]|repo.maven.apache.org
systemProp.https.protocols=TLSv1.2

# Gradle 下载超时与重试（只影响传输，不关闭 TLS 证书校验）。
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=15000
systemProp.org.gradle.internal.http.maxRetry=3
