# Game & Loader Versions
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,]
neo_version=21.1.243
loader_version_range=[4,)

# Parchment Mapping
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Mod Metadata
mod_id=huhutalk
mod_name=HUHUTALK
mod_group_id=com.huhutalk
mod_version=0.1.0-alpha
mod_license=MIT
mod_artifact=huhutalk

# Gradle JVM HTTP 代理，用于拉取Modrinth Maven
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890

# 本地地址不走代理
systemProp.http.nonProxyHosts=localhost|127.*|[::1]
systemProp.https.nonProxyHosts=localhost|127.*|[::1]

# Gradle下载超时与重试配置
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.maxRetry=3



