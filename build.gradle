plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                url "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url = "https://maven.neoforged.net/releases" }
    maven {
        url = "https://maven.blamejared.com" // JourneyMap API
        content {
            includeGroup "info.journeymap"
        }
    }
    mavenCentral()
}

// 声明 localRuntime 配置：仅供开发环境运行时使用（不打包进最终模组）。
// 必须在 dependencies 块之前声明，否则 dependencies { localRuntime(...) } 会找不到方法。
configurations {
    localRuntime
}

dependencies {
    // 车万女仆 编译期依赖（不打包进最终产物，玩家需自行安装）
    compileOnly("maven.modrinth:R0bDWFAW:1.5.3-neoforge+mc1.21.1")

    // JourneyMap 编译期依赖（可选软依赖，用于读取玩家路径点。不打包，玩家无需强制安装）。
    // 版本 ID 3AZpZoxN = 1.21.1-6.0.0-beta.53+neoforge（Modrinth）。仅用于本侧查看/编译其 API。
    compileOnly("maven.modrinth:journeymap:3AZpZoxN")

    // JourneyMap 仅加入开发环境运行时（localRuntime，不打包），便于在游戏内测试路径点功能。
    localRuntime("maven.modrinth:journeymap:3AZpZoxN")

    // JourneyMap API（含 Waypoint 等接口类，在主 jar 之外单独发布）。编译期依赖。
    // exclude 旧的 curse.maven 依赖（会拉来一个 Forge 旧版 JourneyMap）
    compileOnly("info.journeymap:journeymap-api-neoforge:2.0.0-1.21.1") {
        exclude(group: "curse.maven")
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    // 用 filter 逐变量替换，避免 Groovy 模板引擎把模板中的中文括号等误当作表达式解析
    filter { line ->
        replaceProperties.entrySet().stream()
                .reduce(line, (acc, e) -> acc.replace("\${" + e.key + "}", String.valueOf(e.value)), (a, b) -> a)
    }
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

