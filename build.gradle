plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                url "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url = "https://maven.neoforged.net/releases" }
    maven {
        url = "https://maven.blamejared.com" // JourneyMap API
        content {
            includeGroup "info.journeymap"
        }
    }
    mavenCentral()
}

// 声明 localRuntime 配置：仅供开发环境运行时使用（不打包进最终模组）。
// 必须在 dependencies 块之前声明，否则 dependencies { localRuntime(...) } 会找不到方法。
configurations {
    localRuntime
}

dependencies {
    // 车万女仆 编译期依赖（不打包进最终产物，玩家需自行安装）
    compileOnly("maven.modrinth:R0bDWFAW:1.5.3-neoforge+mc1.21.1")

    // JourneyMap 编译期依赖（可选软依赖，用于读取玩家路径点。不打包，玩家无需强制安装）。
    // 版本 ID 3AZpZoxN = 1.21.1-6.0.0-beta.53+neoforge（Modrinth）。仅用于本侧查看/编译其 API。
    compileOnly("maven.modrinth:journeymap:3AZpZoxN")

    // JourneyMap 仅加入开发环境运行时（localRuntime，不打包），便于在游戏内测试路径点功能。
    localRuntime("maven.modrinth:journeymap:3AZpZoxN")

    // JourneyMap API（含 Waypoint 等接口类，在主 jar 之外单独发布）。编译期依赖。
    // exclude 旧的 curse.maven 依赖（会拉来一个 Forge 旧版 JourneyMap）
    compileOnly("info.journeymap:journeymap-api-neoforge:2.0.0-1.21.1") {
        exclude(group: "curse.maven")
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    // 用 filter 逐变量替换，避免 Groovy 模板引擎把模板中的中文括号等误当作表达式解析
    filter { line ->
        replaceProperties.entrySet().stream()
                .reduce(line, (acc, e) -> acc.replace("\${" + e.key + "}", String.valueOf(e.value)), (a, b) -> a)
    }
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ── 开发环境资源镜像（runClient 用）─────────────────────────────────────────────
// 为什么需要它（2026-10-11 用 FML 的 DEBUG 日志定案，不是猜的）：
//   ModDevGradle 通过环境变量 MOD_CLASSES 把该模组的内容目录交给 FML，本工程是两个：
//     huhutalk%%...\build\classes\java\main;huhutalk%%...\build\resources\main
//   FML 只为**其中一个**目录建 mod file（即该模组的资源根），日志原文：
//     Loading mod file ...\build\classes\java\main with languages [LanguageSpec[...javafml...]]
//   资源根落在 classes 目录，而 processResources 的输出在 build/resources/main，
//   于是 runClient 里 assets/huhutalk/** 读不到。
//   ⚠ 注意别把这个和"黑方块"混为一谈：黑方块的直接原因是模型 JSON 解析失败
//     （见 HuhuTalk_电话手表_交接文档 §10），与资源根无关。这个镜像只解决开发期资源可见性。
//
// 副作用与对策：classes 目录里于是有了 assets/data/META-INF 的第二份副本，而
// jar 的内容来自 sourceSets.main.output（= classes 目录 + resources 目录），
// 会报 "Entry huhutalk.mixins.json is a duplicate" —— 由下面的 duplicatesStrategy 兜住。
//
// ⚠⚠ 为什么这里**必须**写成 processResources 的 doLast，而不能注册成正式任务：
//   Gradle 9 的 task-dependency validation 会对**每一个**把 build/classes/java/main
//   当输入的任务报错，而且是一个一个冒出来的：
//     注册成任务后，先打 :jar   -> "uses this output of task ':mirrorDevResources' without
//                                    declaring an explicit dependency"
//     给 jar 加 dependsOn 后，再打 :runClient ->
//                "A problem was found with the configuration of task ':runClient' (type 'RunGameTask')
//                 Gradle detected a problem with the following location: ...\build\classes\java\main"
//   要"正确"就得给 jar / runClient / runServer / runData / runGameTestServer … 挨个加 dependsOn，
//   而且今后每新增一个消费者都会重新踩一次。
//   写成 doLast 里的普通文件写入、**不由任何任务声明为输出**，Gradle 就看不到这层目录重叠，
//   于是不会报 —— 这也正是 §4 那版能跑通 runClient 的原因。
//   代价：processResources 处于 UP-TO-DATE 时 doLast 不执行（镜像不自愈）。
//   可接受：镜像内容只在资源变化后才需要更新，那时 processResources 必然重跑。
tasks.named('processResources').configure {
    doLast {
        copy {
            from layout.buildDirectory.dir('resources/main')
            into layout.buildDirectory.dir('classes/java/main')
        }
    }
}

tasks.named('jar') {
    // 镜像目录不是 jar 的正式内容来源，重复项取第一份即可（两份字节完全相同）。
    // 没有这一行，gradlew build / jar 会直接失败：
    //   > Entry huhutalk.mixins.json is a duplicate but no duplicate handling strategy has been set.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

