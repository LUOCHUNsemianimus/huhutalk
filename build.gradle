// HuhuTalk —— Minecraft 1.20.1 / Forge 47.4.16 / Java 17
// 由 NeoForge 1.21.1 工程迁移而来：本文件只负责构建与打包，
// 业务源码的 API 适配由后续任务卡逐步完成，不能因为 gradle 配置就宣称整库已可编译。

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    // 固定 ForgeGradle 版本，避免动态区间解析漂移。
    id 'net.minecraftforge.gradle' version '6.0.54'
    // MixinGradle：生成 refmap、把 huhutalk.mixins.json 写入 Manifest 的 MixinConfigs。
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = mod_version
group = mod_group_id

// 中文展示文本放在 Gradle 源码里（UTF-8）；gradle.properties 只保存 ASCII 参数。
ext.mod_authors = '罗春'

base {
    archivesName = mod_id
}

// Mojang 在 1.18+ 发行 Java 17；本工程同样以 Java 17 为编译与运行目标。
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// 原生 Forge GameTest 使用独立源集：只参与构建/开发运行，不进入正式 jar。
sourceSets {
    gametest {
        // 显式 setSrcDirs 取代重复的 srcDir：默认源集本身已含 src/gametest/java 与
        // src/gametest/resources，再 add 一次会让 processGametestResources 看到两份
        // port_empty.nbt 并报 duplicate。这里固定为同一组目录，不排除任何资源。
        java.setSrcDirs(['src/gametest/java'])
        resources.setSrcDirs(['src/gametest/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.gametest.output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    // 官方 Mojang 映射（official 1.20.1）。
    mappings channel: mapping_channel, version: mapping_version

    // 让 IDE 运行前把 processResources 的输出放到正确位置（Forge 标准做法）。
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id

            // 仅显式 -PportSmoke 时把驱动所在源集加入客户端，并打开隔离的
            // quickPlay 世界与固定分辨率；普通 client/server 与正式 jar 不包含测试类。
            if (project.hasProperty('portSmoke')) {
                mods {
                    "${mod_id}" {
                        source sourceSets.gametest
                    }
                }
                property 'huhutalk.portSmoke', 'true'
                property 'huhutalk.portSmokeOutput',
                        file('../.workflow/projects/huhutalk-forge-1201/runtime/client-smoke').absolutePath
                args '--quickPlaySingleplayer', 'port-smoke', '--width', '1280', '--height', '720'
            }

            // 仅显式 -PsupplyRescueSmoke：加入「真实补给 + 死亡救援」复现驱动，
            // 复用同一隔离世界 port-smoke，输出到独立目录；不打开旧 portSmoke 开关。
            if (project.hasProperty('supplyRescueSmoke')) {
                mods {
                    "${mod_id}" {
                        source sourceSets.gametest
                    }
                }
                property 'huhutalk.supplyRescueSmoke', 'true'
                property 'huhutalk.supplyRescueSmokeOutput',
                        file('../.workflow/projects/huhutalk-forge-1201/runtime/supply-rescue-smoke').absolutePath
                // 驱动在任何世界修改前用 server.getWorldPath(ROOT).toRealPath() 核对这个绝对路径，
                // 不匹配即 fatal 退出，保证只操作 port-smoke 隔离存档。
                property 'huhutalk.supplyRescueSmokeWorld',
                        file('run/saves/port-smoke').absolutePath
                // 显式 -PsupplyRescueDropInventory 时让死亡阶段走原生掉落语义
                // （keepInventory=false），默认仍保持 true，不改变既有复现语义。
                property 'huhutalk.supplyRescueDropInventory',
                        project.hasProperty('supplyRescueDropInventory').toString()
                // 显式 -PsupplyRescueNoMaidPhone 时不给新建女仆佩戴手机，
                // 用于验证无手机负例；默认 false 保持既有正例语义。
                property 'huhutalk.supplyRescueNoMaidPhone',
                        project.hasProperty('supplyRescueNoMaidPhone').toString()
                args '--quickPlaySingleplayer', 'port-smoke', '--width', '1280', '--height', '720'
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id

            // 只有 GameTest 专用 run 追加验证源集；client/server/生产 jar 不追加。
            mods {
                "${mod_id}" {
                    source sourceSets.gametest
                }
            }
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

// 开发/生产环境都需要 Mixin：refmap 由注解处理器生成，配置名与源码现有文件一致。
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'
    exclude 'src/generated/**/.cache'
}

repositories {
    // Modrinth Maven：按官方 ForgeGradle 说明把 fg.repository 一并放进 forRepositories，
    // 否则 ForgeGradle 注入的仓库会让 exclusiveContent 的解析范围不完整。
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        forRepositories(fg.repository)
        filter {
            includeGroup 'maven.modrinth'
        }
    }

    // Mixin 注解处理器（org.spongepowered:mixin:0.8.5:processor）。
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
        content {
            includeGroup 'org.spongepowered'
        }
    }

    mavenCentral()
}

dependencies {
    // Forge 47.4.16 / MC 1.20.1（userdev 由 ForgeGradle 解析）。
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // 车万女仆 1.5.3 Forge：编译与开发运行期依赖，不打包进最终 jar。
    implementation fg.deobf('maven.modrinth:R0bDWFAW:g1SKoGQJ')

    // JourneyMap 5.10.3 Forge：可选软依赖（只读取路径点），不打包。
    compileOnly fg.deobf('maven.modrinth:journeymap:r7FWVNCs')
    runtimeOnly fg.deobf('maven.modrinth:journeymap:r7FWVNCs')

    // Mixin 注解处理器：生成 huhutalk.refmap.json。
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// 把 gradle.properties 中的 ASCII 参数注入 mods.toml。
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version.toString(),
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                // MixinGradle 也会写入；显式保留，确保生产端加载同一份配置。
                'MixinConfigs'            : "${mod_id}.mixins.json",
        ])
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // 授权声明随 JAR 分发；文件来自仓库根目录，保持原样。
    into('META-INF') {
        from('LICENSE', 'LICENSING.md', 'THIRD_PARTY_NOTICES.md', 'NOTICE', 'ASSET_LICENSES.json', 'TEMPLATE_LICENSE.txt')
        from('LICENSES') {
            into('LICENSES')
        }
    }

    // 生产环境需要 reobf；开发运行使用未混淆 jar。
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    // 完整报告整库移植错误：默认 -Xmaxerrs=100 会截断后续错误，1500 足够覆盖本库。
    options.compilerArgs += ['-Xmaxerrs', '1500']
}

// build/check 必须编译独立 GameTest 源集；不使用排除或 ignoreFailures。
check.dependsOn tasks.named('gametestClasses')

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// 光影开发环境默认关闭；只有显式 -PshaderDev=true 时才加入 Iris/Sodium 与光影 ZIP。
// 注意：gradle/shader-dev.gradle 仍是 NeoForge/1.21.1 的写法，尚未适配 Forge 1.20.1，
// 仅影响该可选开发开关，不参与默认构建（详见 docs/forge-port-status.md）。
if (providers.gradleProperty("shaderDev").map { it.toBoolean() }.getOrElse(false)) {
    apply from: file('gradle/shader-dev.gradle')
}
