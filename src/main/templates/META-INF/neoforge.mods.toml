# huhutalk（狐狐Talk）neoforge.mods.toml
# 车万女仆（Touhou Little Maid）的附属模组，运行于 Minecraft 1.21.1 / NeoForge。
# 标准 TOML v0.5.0 格式，${...} 占位符由 Gradle 打包时替换。

# 模组加载器类型：常规 @Mod 模组使用 javafml
modLoader="javafml" #mandatory

# 加载器版本范围（由 build.gradle 的 loader_version_range 注入）
loaderVersion="${loader_version_range}" #mandatory

# 开源协议
license="${mod_license}" #mandatory

# 问题反馈地址（可选）
#issueTrackerURL=""

# 模组主页（可选）
displayURL="https://github.com/LUOCHUNsemianimus/huhutalk"

[[mods]] #mandatory

# 模组 id
modId="${mod_id}" #mandatory

# 模组版本（1.1.1 正式版）
version="${mod_version}" #mandatory

# 显示名
displayName="${mod_name}" #mandatory

# 更新检查 URL（可选）
#updateJSONURL=""

# 模组作者
authors="罗春"

# 模组简介（多行，mandatory）
description='''
狐狐Talk（huhutalk）是一款车万女仆（Touhou Little Maid）的附属模组。

它为女仆补充了无法远程聊天的空缺，提供了专属于手机 UI 的聊天方式、新的消息接收路径、以及隐私模式的开关。
你可以通过手机随时与女仆保持联系，还支持用自然语言指挥女仆前往指定坐标、驻留或回到身边（move to / come / stay）。

本模组由罗春使用 AI 工作流协助开发。感谢下载与体验！
'''

# Mixin 配置
[[mixins]]
config="${mod_id}.mixins.json"

# 核心依赖：NeoForge
[[dependencies.${mod_id}]] #optional
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

# 核心依赖：Minecraft（1.21.1）
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 前置依赖：车万女仆（本模组为其附属）
[[dependencies.${mod_id}]]
    modId="touhou_little_maid"
    type="required"
    versionRange="[1.5.0,)"
    ordering="AFTER"
    side="BOTH"

# 可选依赖：旅行地图（JourneyMap）—— 未安装也能运行，仅路径点指挥功能不可用。
# 版本范围用 "*"（任意版本），避免 JM 的 beta 预发布版本号被严格范围误判而不加载。
[[dependencies.${mod_id}]]
    modId="journeymap"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"
